<script>
  (() => {
    // Dynamic In-Call Timer Logic
    let secondsElapsed = 268; // 04:28 base
    const timerElem = document.getElementById('call-timer');

    if (timerElem) {
      setInterval(() => {
        secondsElapsed++;
        const mins = Math.floor(secondsElapsed / 60);
        const secs = secondsElapsed % 60;
        const formatted = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        timerElem.textContent = formatted;
      }, 1000);
    }

    // Interactive Mic Toggle
    const micBtn = document.getElementById('mic-btn');
    let isMuted = false;
    if (micBtn) {
      micBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        const iconContainer = micBtn.querySelector('div');
        const iconSpan = micBtn.querySelector('.material-symbols-outlined');
        const labelSpan = micBtn.querySelector('span:last-child');
        
        if (isMuted) {
          iconContainer.className = 'w-14 h-14 rounded-full bg-error text-on-error flex items-center justify-center shadow-md transition-colors';
          iconSpan.textContent = 'mic_off';
          labelSpan.textContent = 'Muted';
        } else {
          iconContainer.className = 'w-14 h-14 rounded-full bg-white/10 text-on-primary flex items-center justify-center hover:bg-white/15 transition-colors';
          iconSpan.textContent = 'mic';
          labelSpan.textContent = 'Mute';
        }
      });
    }

    // Interactive Speaker Toggle
    const speakerBtn = document.getElementById('speaker-btn');
    let isSpeaker = true;
    if (speakerBtn) {
      speakerBtn.addEventListener('click', () => {
        isSpeaker = !isSpeaker;
        const iconContainer = speakerBtn.querySelector('div');
        if (isSpeaker) {
          iconContainer.className = 'w-14 h-14 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-md transition-colors';
        } else {
          iconContainer.className = 'w-14 h-14 rounded-full bg-white/10 text-on-primary flex items-center justify-center hover:bg-white/15 transition-colors';
        }
      });
    }

    // End Call Feedback microinteraction
    const endCallBtn = document.getElementById('end-call-btn');
    if (endCallBtn) {
      endCallBtn.addEventListener('click', () => {
        endCallBtn.innerHTML = `
          <span class="material-symbols-outlined text-[24px] animate-spin">refresh</span>
          <span class="font-title-md text-title-md font-semibold">Call Ended</span>
        `;
        endCallBtn.classList.remove('bg-error');
        endCallBtn.classList.add('bg-outline');
      });
    }

    // Live Captions Trigger
    const captionsBtn = document.getElementById('captions-btn');
    if (captionsBtn) {
      captionsBtn.addEventListener('click', () => {
        const isActive = captionsBtn.textContent.trim() === 'Active';
        captionsBtn.textContent = isActive ? 'Turn On' : 'Active';
        if (!isActive) {
          captionsBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
          captionsBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
        } else {
          captionsBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
          captionsBtn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
        }
      });
    }
  })();
